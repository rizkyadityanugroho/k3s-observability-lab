apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
data:
  v2-dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: v2-dashboards
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/v2-dashboards   
