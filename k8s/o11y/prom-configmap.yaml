apiVersion: v1
data:
  config.yaml: |
    global:
      scrape_interval: 5s

    scrape_configs:
      - job_name: 'alloy'
        static_configs:
          - targets: ['alloy:8888']

      - job_name: 'pgbouncer'
        static_configs:
          - targets: ['pgbouncer-exporter:9127']
kind: ConfigMap
metadata:
  name: prom-config
