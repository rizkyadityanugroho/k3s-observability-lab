apiVersion: v1
kind: Secret
metadata:
  name: pgbouncer-exporter-auth
stringData:
  PGBOUNCER_EXPORTER_CONNECTION_STRING: postgres://pgbouncer:password@pgbouncer:6432/pgbouncer?sslmode=disable
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgbouncer-exporter
  template:
    metadata:
      labels:
        app: pgbouncer-exporter
    spec:
      containers:
        - name: exporter
          image: prometheuscommunity/pgbouncer-exporter:v0.12.1
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: pgbouncer-exporter-auth
          ports:
            - name: metrics
              containerPort: 9127
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      nodeSelector:
        role: db
---
apiVersion: v1
kind: Service
metadata:
  name: pgbouncer-exporter
spec:
  type: ClusterIP
  selector:
    app: pgbouncer-exporter
  ports:
    - name: metrics
      port: 9127
      targetPort: metrics
