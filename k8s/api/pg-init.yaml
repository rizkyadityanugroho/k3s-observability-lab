kind: ConfigMap
apiVersion: v1
metadata:
  name: pg-init
data:
  init.sql: |
    -- Lookup role for pgbouncer auth_query + the secure function
    -- Change the password to something stronger later
    CREATE ROLE pgbouncer LOGIN PASSWORD 'password';
    CREATE SCHEMA IF NOT EXISTS pgbouncer AUTHORIZATION CURRENT_USER;
    CREATE OR REPLACE FUNCTION pgbouncer.user_lookup(
      IN i_username text,
      OUT uname text,
      OUT phash text
    )
    RETURNS record
    LANGUAGE plpgsql
    SECURITY DEFINER
    SET search_path = pg_catalog,
    pg_temp
    AS $$
    BEGIN
      SELECT
          rolname,
          CASE WHEN rolvaliduntil < now() THEN NULL
          ELSE rolpassword END
      INTO uname, phash
      FROM pg_authid
      WHERE rolname = i_username
        AND rolcanlogin
      ;
      RETURN;
    END;
    $$;
    
    REVOKE ALL ON SCHEMA pgbouncer FROM PUBLIC;
    GRANT USAGE ON SCHEMA pgbouncer TO pgbouncer;

    REVOKE ALL ON FUNCTION pgbouncer.user_lookup(text) FROM PUBLIC;
    GRANT EXECUTE ON FUNCTION pgbouncer.user_lookup(text) TO pgbouncer;
