apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prom-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 500M
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prom
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prom
  template:
    metadata:
      labels:
        app: prom
    spec:
      containers:
        - name: prom
          image: prom/prometheus:v3.13.4-busybox
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yaml
            - --web.enable-remote-write-receiver
          ports:
            - name: prom
              containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yaml
              subPath: config.yaml
              readOnly: true
      nodeSelector:
        role: obs
      volumes:
        - name: config
          configMap:
            name: prom-config
---
apiVersion: v1
kind: Service
metadata:
  name: prom
spec:
  selector:
    app: prom
  ports:
    - name: prom
      port: 9090
      targetPort: 9090

